[platformio]
default_envs = tdeck
boards_dir = boards
; optional extra builds kept outside this repository (none here)
extra_configs = private/*.ini

[env:tdeck]
platform = espressif32@6.3.0
board = T-Deck
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bitbank2/PNGdec@1.1.6
    h2zero/NimBLE-Arduino@1.4.2
    ricmoo/QRCode@0.0.1
build_flags =
    -DBOARD_HAS_PSRAM=1
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; the T-Deck panel takes blue first
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_MISO=38
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=12
    -DTFT_DC=11
    -DTFT_RST=-1
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
extra_scripts =
    pre:tools/web_gz.py
    post:tools/merge_bin.py
